<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Orbit — Developer Dashboard</title>
  <meta name="description" content="Orbit — one keyboard-first workspace for projects, tasks, time, notes and your dev stack." />

  <meta name="theme-color" content="#f4f4fa" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script>
    /* Apply the saved app theme before first paint (no dark→light flash). */
    try {
      var t = localStorage.getItem('orbit:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body style="margin:0;padding:0;">
  <div id="root" style="width:100%;height:100vh;height:100dvh;"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
